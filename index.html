<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享電子名片</title>

    <!-- LINE LIFF SDK -->
    <script charset="utf-8"
        src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
    <div style="
        text-align:center;
        margin-top:50px;
        font-family:sans-serif;
    ">
        <h2>正在開啟 LINE 分享...</h2>
        <p id="status">請稍候</p>
    </div>

<script>

const LIFF_ID = "2011294294-GVhofamg";

/*
 * 電子名片
 */
const flexMessage = {
    type: "flex",
    altText: "我的電子名片",

    contents: {
  "type": "bubble",
  "hero": {
    "type": "image",
    "url": "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png",
    "size": "full",
    "aspectRatio": "20:13",
    "aspectMode": "cover",
    "action": {
      "type": "uri",
      "uri": "https://line.me/"
    }
  },
  "body": {
    "type": "box",
    "layout": "vertical",
    "contents": [
      {
        "type": "text",
        "text": "Brown Cafe",
        "weight": "bold",
        "size": "xl"
      },
      {
        "type": "box",
        "layout": "baseline",
        "margin": "md",
        "contents": [
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
          },
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
          },
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
          },
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
          },
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gray_star_28.png"
          },
          {
            "type": "text",
            "text": "4.0",
            "size": "sm",
            "color": "#999999",
            "margin": "md",
            "flex": 0
          }
        ]
      },
      {
        "type": "box",
        "layout": "vertical",
        "margin": "lg",
        "spacing": "sm",
        "contents": [
          {
            "type": "box",
            "layout": "baseline",
            "spacing": "sm",
            "contents": [
              {
                "type": "text",
                "text": "Place",
                "color": "#aaaaaa",
                "size": "sm",
                "flex": 1
              },
              {
                "type": "text",
                "text": "Flex Tower, 7-7-4 Midori-ku, Tokyo",
                "wrap": true,
                "color": "#666666",
                "size": "sm",
                "flex": 5
              }
            ]
          },
          {
            "type": "box",
            "layout": "baseline",
            "spacing": "sm",
            "contents": [
              {
                "type": "text",
                "text": "Time",
                "color": "#aaaaaa",
                "size": "sm",
                "flex": 1
              },
              {
                "type": "text",
                "text": "10:00 - 23:00",
                "wrap": true,
                "color": "#666666",
                "size": "sm",
                "flex": 5
              }
            ]
          }
        ]
      }
    ]
  },
  "footer": {
    "type": "box",
    "layout": "vertical",
    "spacing": "sm",
    "contents": [
      {
        "type": "button",
        "style": "link",
        "action": {
          "type": "uri",
          "label": "CALL",
          "uri": "https://liff.line.me/2011294294-GVhofamg"
        },
        "height": "sm"
      },
      {
        "type": "button",
        "style": "link",
        "height": "sm",
        "action": {
          "type": "uri",
          "label": "WEBSITE",
          "uri": "https://line.me/"
        }
      },
      {
        "type": "box",
        "layout": "vertical",
        "contents": [],
        "margin": "sm"
      }
    ],
    "flex": 0
  }
},

        footer: {
            type: "box",
            layout: "vertical",
            spacing: "sm",

            contents: [

                {
                    type: "button",
                    style: "primary",
                    color: "#06C755",

                    action: {
                        type: "uri",
                        label: "查看完整名片",

                        /*
                         * 點擊後進入你的 LIFF
                         */
                        uri: "https://liff.line.me/2011294294-GVhofamg"
                    }
                },

                {
                    type: "button",
                    style: "link",

                    action: {
                        type: "uri",
                        label: "我的網站",
                        uri: "https://pingpenchang-commits.github.io/Line/"
                    }
                }

            ]
        }
    }
};


/*
 * 初始化 LIFF
 */
liff.init({
    liffId: LIFF_ID
})

.then(() => {

    console.log("LIFF 初始化成功");

    document.getElementById("status").innerText =
        "正在開啟分享對象選擇器...";


    /*
     * 確認登入
     */
    if (!liff.isLoggedIn()) {

        liff.login();

        return;
    }


    /*
     * 分享電子名片
     */
    return liff.shareTargetPicker([
        flexMessage
    ]);

})

.then((result) => {

    if (!result) {
        console.log("使用者取消分享");

        document.getElementById("status").innerText =
            "已取消分享";

        return;
    }

    console.log("分享成功");

    document.getElementById("status").innerText =
        "分享成功！";

    /*
     * 延遲關閉
     */
    setTimeout(() => {

        if (liff.isInClient()) {
            liff.closeWindow();
        }

    }, 800);

})

.catch((error) => {

    console.error("LIFF 錯誤:", error);

    document.getElementById("status").innerText =
        "發生錯誤，請查看 Console";

    alert(
        "LINE 分享發生錯誤：\n\n" +
        (error.message || error)
    );

});

</script>

</body>
</html>
