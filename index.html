<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

<script>

async function main() {

  await liff.init({
    liffId: "2011294294-wkNx8TPb"
  });

  if (!liff.isLoggedIn()) {
    liff.login();
    return;
  }

  if (!liff.isApiAvailable("shareTargetPicker")) {
    alert("目前環境無法使用分享功能");
    return;
  }

  await liff.shareTargetPicker([
    {
      type: "flex",
      altText: "三久太陽能經銷商電子名片",

      contents: {

        "type": "bubble",

        "body": {
          "type": "box",
          "layout": "vertical",

          "contents": [

            {
              "type": "text",
              "text": "三久行",
              "weight": "bold",
              "size": "xl"
            },

            {
              "type": "text",
              "text": "三久太陽能經銷商",
              "size": "md",
              "margin": "md"
            },

            {
              "type": "separator",
              "margin": "lg"
            },

            {
              "type": "text",
              "text": "專業太陽能熱水器",
              "margin": "lg"
            },

            {
              "type": "text",
              "text": "☎️ 0915-330885",
              "margin": "md"
            }

          ]
        },

        "footer": {
          "type": "box",
          "layout": "vertical",

          "contents": [

            {
              "type": "button",
              "style": "primary",

              "action": {
                "type": "uri",
                "label": "立即聯絡",
                "uri": "tel:0915330885"
              }
            }

          ]
        }

      }
    }
  ]);

}

main();

</script>

</body>
</html>
