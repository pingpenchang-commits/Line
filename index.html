/*
 * ============================

 */

liff.init({

})

.then(() => {

    document.getElementById("status").innerText =

    /*
     * 檢查登入
     */

    if (!liff.isLoggedIn()) {

        liff.login();

    /*

     */

    return liff.shareTargetPicker([
        flexMessage
    ]);

})


.then((result) => {

    /*
     * 如果前一步因為 liff.login()
     * 而沒有執行分享，就不要繼續處理
     */

    if (result === null) {
        return;
    }


    if (!result) {

        console.log("使用者取消分享");

        document.getElementById("status").innerText =
            "已取消分享";

        return;
    }


    console.log("分享成功");

    document.getElementById("status").innerText =
        "分享成功！";


    /*
     * 分享完成後關閉 LIFF
     */

    setTimeout(() => {

        if (liff.isInClient()) {
            liff.closeWindow();
        }

    }, 800);

})


.catch((error) => {

    console.error("LIFF 錯誤:", error);

    document.getElementById("status").innerText =
        "發生錯誤，請查看 Console";

    alert(
        "LINE 分享發生錯誤：\n\n" +
        (error.message || error)
    );

});
