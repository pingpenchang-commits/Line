<!DOCTYPE html>
<html lang="zh-TW">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>分享電子名片</title>

    <!-- LINE LIFF SDK -->
    <script charset="utf-8"
        src="https://static.line-scdn.net/liff/edge/2/sdk.js">
    </script>

</head>


<body>

    <div style="
        text-align:center;
        margin-top:50px;
        font-family:sans-serif;
    ">

        <h2>正在開啟 LINE 分享...</h2>

        <p id="status">
            請稍候
        </p>

    </div>


<script>


/*
 * =========================================================
 * LIFF ID
 * =========================================================
 */

const LIFF_ID = "2011294294-GVhofamg";


/*
 * =========================================================
 * LINE Flex Message
 * 電子名片：吳勝雄／清水三久行
 *
 * 這裡已改成 Flex Message Simulator 提供的版本
 * =========================================================
 */

const flexMessage = {

    type: "flex",

    altText: "吳勝雄｜清水三久行｜電子名片",

    contents: {

        type: "bubble",


        /*
         * =====================================================
         * HERO
         * =====================================================
         */

        hero: {

            type: "image",

            url:
                "https://i.ibb.co/1Y1ZZ9xq/logo.jpg",

            size: "full",

            aspectRatio: "60:11",

            aspectMode: "cover",

            gravity: "center",

            action: {

                type: "uri",

                label: "LINE",

                uri:
                    "https://line.me/"

            }

        },


        /*
         * =====================================================
         * BODY
         * =====================================================
         */

        body: {

            type: "box",

            layout: "vertical",

            spacing: "none",

            contents: [


                /*
                 * -------------------------------------------------
                 * 姓名
                 * -------------------------------------------------
                 */

                {

                    type: "box",

                    layout: "vertical",

                    borderWidth: "bold",

                    height: "100px",

                    contents: [

                        {

                            type: "text",

                            text: "吳勝雄",

                            size: "xxl",

                            weight: "bold",

                            align: "center",

                            gravity: "center",

                            offsetTop: "xxl"

                        }

                    ]

                },


                /*
                 * -------------------------------------------------
                 * 公司資訊
                 * -------------------------------------------------
                 */

                {

                    type: "box",

                    layout: "vertical",

                    backgroundColor: "#CCEEFF",

                    borderWidth: "10px",

                    cornerRadius: "md",

                    contents: [


                        /*
                         * 公司 Logo + 公司名稱
                         */

                        {

                            type: "box",

                            layout: "horizontal",

                            height: "30px",

                            contents: [

                                {

                                    type: "image",

                                    url:
                                        "https://i.ibb.co/zWpPKR2w/SUNCUE.png",

                                    size: "xs",

                                    align: "start",

                                    gravity: "center"

                                },

                                {

                                    type: "text",

                                    text: "清水三久行",

                                    align: "start",

                                    gravity: "center",

                                    size: "md",

                                    weight: "bold",

                                    offsetEnd: "55px"

                                }

                            ]

                        },


                        /*
                         * 分隔線
                         */

                        {

                            type: "box",

                            layout: "vertical",

                            height: "20px",

                            contents: [

                                {

                                    type: "separator",

                                    margin: "md",

                                    color: "#FFFFFF"

                                }

                            ]

                        },


                        /*
                         * 地址
                         */

                        {

                            type: "box",

                            layout: "vertical",

                            height: "30px",

                            contents: [

                                {

                                    type: "text",

                                    text:
                                        "地址：台中市清水區高美路49號",

                                    weight: "bold"

                                }

                            ]

                        },


                        /*
                         * 電話
                         */

                        {

                            type: "box",

                            layout: "vertical",

                            height: "25px",

                            contents: [

                                {

                                    type: "text",

                                    text:
                                        "電話：0915-330885",

                                    weight: "bold",

                                    action: {

                                        type: "uri",

                                        label: "撥打電話",

                                        uri:
                                            "tel:0915330885"

                                    }

                                }

                            ]

                        }

                    ]

                },


                /*
                 * =================================================
                 * 聯絡按鈕
                 * =================================================
                 */

                {

                    type: "box",

                    layout: "horizontal",

                    offsetTop: "md",

                    spacing: "md",

                    margin: "none",

                    offsetBottom: "md",

                    paddingBottom: "md",

                    contents: [


                        /*
                         * 加 LINE 聯繫
                         */

                        {

                            type: "button",

                            action: {

                                type: "uri",

                                label: "加 LINE 聯繫",

                                uri:
                                    "https://line.me/ti/p/4CZK6ZqENq"

                            },

                            style: "primary",

                            color: "#0044BB"

                        },


                        /*
                         * 官方網站
                         */

                        {

                            type: "button",

                            action: {

                                type: "uri",

                                label: "官方網站",

                                uri:
                                    "https://suncue72.wordpress.com/"

                            },

                            style: "primary",

                            height: "md",

                            margin: "md",

                            color: "#003C9D"

                        }

                    ]

                }

            ]

        },


        /*
         * =========================================================
         * FOOTER
         * =========================================================
         */

        footer: {

            type: "box",

            layout: "horizontal",

            spacing: "xs",

            height: "60px",

            contents: [


                /*
                 * -------------------------------------------------
                 * Facebook
                 * -------------------------------------------------
                 */

                {

                    type: "box",

                    layout: "horizontal",

                    height: "60px",

                    contents: [

                        {

                            type: "image",

                            url:
                                "https://i.ibb.co/Q3GkgjcX/facboo1.png",

                            size: "xs",

                            align: "start",

                            offsetBottom: "11px",

                            gravity: "top",

                            action: {

                                type: "uri",

                                label: "Facebook",

                                uri:
                                    "https://reurl.cc/6XXbZV"

                            }

                        }

                    ]

                },


                /*
                 * -------------------------------------------------
                 * 分享
                 * -------------------------------------------------
                 */

                {

                    type: "box",

                    layout: "horizontal",

                    offsetEnd: "20px",

                    action: {

                        type: "uri",

                        label: "分享名片",

                        uri:
                            "https://liff.line.me/2011294294-GVhofamg"

                    },

                    contents: [

                        {

                            type: "image",

                            url:
                                "https://i.ibb.co/3YPf9FMZ/share.png",

                            size: "xxs",

                            align: "start"

                        },

                        {

                            type: "text",

                            text: "分享",

                            weight: "bold",

                            align: "start",

                            gravity: "center"

                        }

                    ]

                },


                /*
                 * -------------------------------------------------
                 * SUNCUE Logo
                 * -------------------------------------------------
                 */

                {

                    type: "box",

                    layout: "vertical",

                    width: "120px",

                    offsetBottom: "5px",

                    contents: [

                        {

                            type: "image",

                            url:
                                "https://i.ibb.co/zWpPKR2w/SUNCUE.png",

                            size: "md",

                            offsetBottom: "25px",

                            offsetEnd: "10px",

                            gravity: "top",

                            action: {

                                type: "uri",

                                label: "SUNCUE 官方網站",

                                uri:
                                    "https://www.suncue.tw/"

                            }

                        }

                    ]

                }

            ]

        },


        /*
         * =========================================================
         * STYLES
         * =========================================================
         */

        styles: {

            footer: {

                separatorColor: "#DDDDDD",

                separator: true

            }

        }

    }

};


/*
 * =========================================================
 * 初始化 LIFF
 * =========================================================
 */

liff.init({

    liffId: LIFF_ID

})

.then(() => {


    console.log(
        "LIFF 初始化成功"
    );


    document.getElementById(
        "status"
    ).innerText =
        "正在開啟分享對象選擇器...";


    /*
     * =====================================================
     * 檢查 LINE 登入狀態
     * =====================================================
     */

    if (!liff.isLoggedIn()) {

        liff.login();

        return null;

    }


    /*
     * =====================================================
     * 開啟 LINE 分享對象選擇器
     * =====================================================
     */

    return liff.shareTargetPicker([

        flexMessage

    ]);

})


.then((result) => {


    /*
     * =====================================================
     * 如果前面執行 liff.login()
     * 就不繼續執行分享結果
     * =====================================================
     */

    if (result === null) {

        return;

    }


    /*
     * =====================================================
     * 使用者取消分享
     * =====================================================
     */

    if (!result) {

        console.log(
            "使用者取消分享"
        );


        document.getElementById(
            "status"
        ).innerText =
            "已取消分享";

        return;

    }


    /*
     * =====================================================
     * 分享成功
     * =====================================================
     */

    console.log(
        "分享成功"
    );


    document.getElementById(
        "status"
    ).innerText =
        "分享成功！";


    /*
     * =====================================================
     * 分享完成後關閉 LIFF
     * =====================================================
     */

    setTimeout(() => {


        if (liff.isInClient()) {

            liff.closeWindow();

        }


    }, 800);

})


.catch((error) => {


    /*
     * =====================================================
     * 錯誤處理
     * =====================================================
 */

    console.error(

        "LIFF 錯誤:",

        error

    );


    document.getElementById(
        "status"
    ).innerText =
        "發生錯誤，請查看 Console";


    alert(

        "LINE 分享發生錯誤：\n\n" +

        (

            error.message ||

            error

        )

    );

});


</script>

</body>

</html>
