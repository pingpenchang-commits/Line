<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排查專用</title>
    <!-- 1. 這裡我幫你換成最安全的官方 CDN 網址，絕對不會解析錯誤 -->
    <script charset="utf-8" src="https://line-scdn.net"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; text-align: center;">

    <div style="background: #f0f0f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left;">
        <strong>📊 偵錯狀態面板：</strong>
        <ul id="debug-log" style="line-height: 1.8;">
            <li>⏳ 正在驗證 SDK 是否正常載入...</li>
        </ul>
    </div>

    <h2>正在載入 LINE 分享視窗...</h2>

    <script>
        const logEl = document.getElementById('debug-log');
        function addLog(text, color = "black") {
            logEl.innerHTML += `<li style="color: ${color}">${text}</li>`;
        }

        // 2. 防呆機制：先檢查 liff 有沒有成功下載，沒下載成功就不往下執行避免卡死
        if (typeof liff === 'undefined') {
            addLog("❌ 嚴重錯誤：LINE SDK 載入失敗！網頁仍然讀取到舊的 line-scdn 網址，請確認 GitHub 已成功發布，或更換瀏覽器測試。", "red");
        } else {
            addLog("✅ SDK 載入完成，開始初始化...");
            
            liff.init({ liffId: '2011294294-GVhofamg' })
                .then(() => {
                    addLog("✅ LIFF 初始化成功！", "green");
                    
                    if (!liff.isLoggedIn()) {
                        addLog("⚠️ 用戶尚未登入，正在導向登入頁面...", "orange");
                        liff.login();
                    } else {
                        addLog("✅ 用戶已登入，開始喚起好友列表...", "green");
                        
                        liff.shareTargetPicker([
                            {
                                "type": "text",
                                "text": "這是一則來自 LIFF 的測試分享訊息！"
                            }
                        ])
                        .then(() => { liff.closeWindow(); })
                        .catch((err) => { alert("分享失敗: " + err); });
                    }
                })
                .catch((err) => {
                    addLog("❌ 初始化失敗原因: " + err.message, "red");
                });
        }
    </script>
</body>
</html>
