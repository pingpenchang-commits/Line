<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享電子名片</title>

    <!-- LINE LIFF SDK -->
    <script charset="utf-8"
        src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>
    <div style="
        text-align:center;
        margin-top:50px;
        font-family:sans-serif;
    ">
        <h2>正在開啟 LINE 分享...</h2>
        <p id="status">請稍候</p>
    </div>

<script>

const LIFF_ID = "2011294294-GVhofamg";

/*
 * 電子名片
 */
const flexMessage = {
    type: "flex",
    altText: "我的電子名片",

    contents: {

        type: "bubble",

        size: "mega",

        hero: {
            type: "image",

            /*
             * 先使用 LINE 官方圖片測試
             * 之後可以換成你的照片
             */
            url: "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png",

            size: "full",
            aspectRatio: "20:13",
            aspectMode: "cover"
        },

        body: {
            type: "box",
            layout: "vertical",
            spacing: "md",

            contents: [

                {
                    type: "text",
                    text: "陳先生",
                    weight: "bold",
                    size: "xl",
                    color: "#222222"
                },

                {
                    type: "text",
                    text: "電子名片",
                    size: "sm",
                    color: "#888888"
                },

                {
                    type: "separator",
                    margin: "lg"
                },

                {
                    type: "box",
                    layout: "vertical",
                    margin: "lg",
                    spacing: "sm",

                    contents: [

                        {
                            type: "box",
                            layout: "baseline",

                            contents: [
                                {
                                    type: "text",
                                    text: "電話",
                                    size: "sm",
                                    color: "#888888",
                                    flex: 2
                                },
                                {
                                    type: "text",
                                    text: "0912-345-678",
                                    size: "sm",
                                    color: "#333333",
                                    flex: 5,
                                    wrap: true
                                }
                            ]
                        },

                        {
                            type: "box",
                            layout: "baseline",

                            contents: [
                                {
                                    type: "text",
                                    text: "Email",
                                    size: "sm",
                                    color: "#888888",
                                    flex: 2
                                },
                                {
                                    type: "text",
                                    text: "example@email.com",
                                    size: "sm",
                                    color: "#333333",
                                    flex: 5,
                                    wrap: true
                                }
                            ]
                        },

                        {
                            type: "box",
                            layout: "baseline",

                            contents: [
                                {
                                    type: "text",
                                    text: "公司",
                                    size: "sm",
                                    color: "#888888",
                                    flex: 2
                                },
                                {
                                    type: "text",
                                    text: "ABC 科技有限公司",
                                    size: "sm",
                                    color: "#333333",
                                    flex: 5,
                                    wrap: true
                                }
                            ]
                        }

                    ]
                }
            ]
        },

        footer: {
            type: "box",
            layout: "vertical",
            spacing: "sm",

            contents: [

                {
                    type: "button",
                    style: "primary",
                    color: "#06C755",

                    action: {
                        type: "uri",
                        label: "查看完整名片",

                        /*
                         * 點擊後進入你的 LIFF
                         */
                        uri: "https://liff.line.me/2011294294-GVhofamg"
                    }
                },

                {
                    type: "button",
                    style: "link",

                    action: {
                        type: "uri",
                        label: "我的網站",
                        uri: "https://pingpenchang-commits.github.io/Line/"
                    }
                }

            ]
        }
    }
};


/*
 * 初始化 LIFF
 */
liff.init({
    liffId: LIFF_ID
})

.then(() => {

    console.log("LIFF 初始化成功");

    document.getElementById("status").innerText =
        "正在開啟分享對象選擇器...";


    /*
     * 確認登入
     */
    if (!liff.isLoggedIn()) {

        liff.login();

        return;
    }


    /*
     * 分享電子名片
     */
    return liff.shareTargetPicker([
        flexMessage
    ]);

})

.then((result) => {

    if (!result) {
        console.log("使用者取消分享");

        document.getElementById("status").innerText =
            "已取消分享";

        return;
    }

    console.log("分享成功");

    document.getElementById("status").innerText =
        "分享成功！";

    /*
     * 延遲關閉
     */
    setTimeout(() => {

        if (liff.isInClient()) {
            liff.closeWindow();
        }

    }, 800);

})

.catch((error) => {

    console.error("LIFF 錯誤:", error);

    document.getElementById("status").innerText =
        "發生錯誤，請查看 Console";

    alert(
        "LINE 分享發生錯誤：\n\n" +
        (error.message || error)
    );

});

</script>

</body>
</html>
```
