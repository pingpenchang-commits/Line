<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>排查專用</title>
    <script charset="utf-8" src="https://line-scdn.net"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; text-align: center;">

    <div style="background: #f0f0f0; padding: 15px; border-radius: 8px; margin-bottom: 20px; text-align: left;">
        <strong>📊 偵錯狀態面板：</strong>
        <ul id="debug-log" style="line-height: 1.8;">
            <li>⏳ 正在載入 LINE SDK...</li>
        </ul>
    </div>

    <div id="loading-msg">
        <h2>正在載入 LINE 分享視窗...</h2>
    </div>

    <script>
        const logEl = document.getElementById('debug-log');
        function addLog(text, color = "black") {
            logEl.innerHTML += `<li style="color: ${color}">${text}</li>`;
        }

        // 🚨 請把下面的 '123456-abcdef' 換成你實際的 LIFF ID
        const MY_LIFF_ID = '2011294294-GVhofamg'; 

        addLog("✅ SDK 載入完成，開始初始化...");
        
        liff.init({ liffId: MY_LIFF_ID })
            .then(() => {
                addLog("✅ LIFF 初始化成功！", "green");
                addLog("📱 當前運行環境: " + (liff.isInClient() ? "LINE App 內部" : "外部瀏覽器"));

                if (!liff.isLoggedIn()) {
                    addLog("⚠️ 用戶尚未登入，正在導向 LINE 登入頁面...", "orange");
                    liff.login();
                } else {
                    addLog("✅ 用戶已登入，開始喚起好友列表...", "green");
                    
                    // 執行分享
                    liff.shareTargetPicker([
                        {
                            "type": "text",
                            "text": "這是一則來自 LIFF 的測試分享訊息！"
                        }
                    ])
                    .then((res) => {
                        if (res) {
                            addLog("🎉 分享成功送出！", "green");
                        } else {
                            addLog("❌ 用戶取消了分享", "red");
                        }
                        setTimeout(() => liff.closeWindow(), 1500);
                    })
                    .catch((err) => {
                        addLog("❌ shareTargetPicker 喚起失敗！原因: " + JSON.stringify(err), "red");
                        alert("分享失敗錯誤: " + err.message);
                    });
                }
            })
            .catch((err) => {
                addLog("❌ LIFF 初始化失敗！錯誤代碼: " + err.code + " / " + err.message, "red");
                alert("初始化失敗: " + err.message);
            });
    </script>
</body>
</html>
