<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享數位名片</title>
    <!-- 引入 LINE 官方 LIFF SDK -->
    <script src="https://line.me"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            text-align: center;
            padding: 30px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 85%;
            max-width: 320px;
        }
        .btn-share {
            background-color: #06C755;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
            width: 100%;
            margin-top: 15px;
        }
        .status-text {
            color: #666;
            font-size: 15px;
            margin: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="status" class="status-text">數位名片系統</div>
        <!-- 點擊直接呼叫分享，不再進行多餘的 API 條件判斷 -->
        <button class="btn-share" onclick="sendMyCard()">點擊分享我的名片</button>
    </div>

    <script>
        // 您的專屬 LIFF ID
        const MY_LIFF_ID = '2011294294-wkNx8TPb';

        // 符合 LINE 規範的完整名片 JSON
        const FLEX_MESSAGE_CONTENT = {
  "type": "bubble",
  "hero": {
    "type": "image",
    "url": "https://i.ibb.co/NcQJQvC/image.jpg",
    "size": "full",
    "aspectRatio": "20:13",
    "aspectMode": "fit",
    "action": {
      "type": "uri",
      "uri": "https://line.me/"
    },
    "position": "relative",
    "margin": "none",
    "align": "center"
  },
  "body": {
    "type": "box",
    "layout": "vertical",
    "contents": [
      {
        "type": "text",
        "text": "Brown Cafe",
        "weight": "bold",
        "size": "xl"
      },
      {
        "type": "box",
        "layout": "baseline",
        "margin": "md",
        "contents": [
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
          },
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
          },
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
          },
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gold_star_28.png"
          },
          {
            "type": "icon",
            "size": "sm",
            "url": "https://developers-resource.landpress.line.me/fx/img/review_gray_star_28.png"
          },
          {
            "type": "text",
            "text": "4.0",
            "size": "sm",
            "color": "#999999",
            "margin": "md",
            "flex": 0
          }
        ]
      },
      {
        "type": "box",
        "layout": "vertical",
        "margin": "lg",
        "spacing": "sm",
        "contents": [
          {
            "type": "box",
            "layout": "baseline",
            "spacing": "sm",
            "contents": [
              {
                "type": "text",
                "text": "Place",
                "color": "#aaaaaa",
                "size": "sm",
                "flex": 1
              },
              {
                "type": "text",
                "text": "Flex Tower, 7-7-4 Midori-ku, Tokyo",
                "wrap": true,
                "color": "#666666",
                "size": "sm",
                "flex": 5
              }
            ]
          },
          {
            "type": "box",
            "layout": "baseline",
            "spacing": "sm",
            "contents": [
              {
                "type": "text",
                "text": "Time",
                "color": "#aaaaaa",
                "size": "sm",
                "flex": 1
              },
              {
                "type": "text",
                "text": "10:00 - 23:00",
                "wrap": true,
                "color": "#666666",
                "size": "sm",
                "flex": 5
              }
            ]
          }
        ]
      }
    ]
  },
  "footer": {
    "type": "box",
    "layout": "vertical",
    "spacing": "sm",
    "contents": [
      {
        "type": "button",
        "style": "link",
        "height": "sm",
        "action": {
          "type": "uri",
          "label": "CALL",
          "uri": "https://liff.line.me/2011294294-wkNx8TPb"
        }
      },
      {
        "type": "button",
        "style": "link",
        "height": "sm",
        "action": {
          "type": "uri",
          "label": "WEBSITE",
          "uri": "https://line.me/"
        }
      },
      {
        "type": "box",
        "layout": "vertical",
        "contents": [],
        "margin": "sm"
      }
    ],
    "flex": 0
  }
};

        // 頁面開啟時，單純初始化並強制要求登入
        liff.init({ liffId: MY_LIFF_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    document.getElementById('status').innerText = '系統連線成功！';
                }
            })
            .catch((err) => {
                document.getElementById('status').innerText = '系統初始化失敗';
                console.error(err);
            });

        // 核心分享功能：移除所有 IF 檢查，直接強制喚醒 LINE 的分享視窗
        function sendMyCard() {
            document.getElementById('status').innerText = '正在喚醒 LINE 好友選單...';
            
            liff.shareTargetPicker([
                {
                    type: "flex",
                    altText: "您收到了一張數位名片",
                    contents: FLEX_MESSAGE_CONTENT
                }
            ])
            .then((res) => {
                if (res) {
                    document.getElementById('status').innerText = '名片分享成功！';
                    setTimeout(() => { liff.closeWindow(); }, 1200);
                } else {
                    document.getElementById('status').innerText = '您取消了分享';
                }
            })
            .catch((error) => {
                document.getElementById('status').innerText = '分享失敗，請檢查 LINE 後台開關';
                alert('錯誤訊號：' + JSON.stringify(error));
            });
        }
    </script>
</body>
</html>
