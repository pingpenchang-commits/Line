<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試分享</title>
    <script src="https://line-scdn.net"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h2>正在載入 LINE 分享視窗...</h2>
    </div>

    <script>
        // 🚨 請把下面的 123456-abcdef 換成你實際的 LIFF ID (不是完整網址)
        liff.init({ liffId: '2011294294-GVhofamg' })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                } else {
                    // 測試發送純文字
                    liff.shareTargetPicker([
                        {
                            "type": "text",
                            "text": "這是一則來自 LIFF 的測試分享訊息！"
                        }
                    ])
                    .then(() => { liff.closeWindow(); })
                    .catch((err) => { alert("分享失敗: " + err); });
                }
            })
            .catch((err) => { alert("初始化失敗: " + err); });
    </script>
</body>
</html>
