<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分享數位名片</title>
    <!-- 引入 LINE LIFF SDK -->
    <script src="https://line.me"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f7f6;
        }
        .container {
            text-align: center;
            padding: 30px 20px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            width: 85%;
            max-width: 320px;
        }
        .btn-share {
            background-color: #06C755; /* LINE 官方綠色 */
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
            width: 100%;
            margin-top: 15px;
            display: none; /* 初始隱藏，初始化成功才顯示 */
        }
        .btn-share:active {
            background-color: #05b34c;
            transform: scale(0.98);
        }
        .status-text {
            color: #666;
            font-size: 15px;
            margin: 10px 0;
        }
        /* 載入動畫 */
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #06C755;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader" class="spinner"></div>
        <div id="status" class="status-text">正在連線至 LINE 系統...</div>
        <!-- 手動點擊按鈕，確保 100% 成功觸發 -->
        <button id="share-btn" class="btn-share" onclick="sendMyCard()">點擊分享我的名片</button>
    </div>

    <script>
        // 您的專屬 LIFF ID
        const MY_LIFF_ID = '2011294294-wkNx8TPb';

        // 符合 LINE 規範的完整名片 JSON
        const FLEX_MESSAGE_CONTENT = {
          "type": "bubble",
          "body": {
            "type": "box",
            "layout": "vertical",
            "contents": [
              {
                "type": "text",
                "text": "DIGITAL CARD",
                "weight": "bold",
                "color": "#1DB446",
                "size": "sm"
              },
              {
                "type": "text",
                "text": "您的名字",
                "weight": "bold",
                "size": "xxl",
                "margin": "md"
              },
              {
                "type": "text",
                "text": "職稱 / 公司名稱",
                "size": "xs",
                "color": "#aaaaaa",
                "wrap": true
              },
              {
                "type": "separator",
                "margin": "xxl"
              },
              {
                "type": "box",
                "layout": "vertical",
                "margin": "xxl",
                "spacing": "sm",
                "contents": [
                  {
                    "type": "box",
                    "layout": "horizontal",
                    "contents": [
                      {
                        "type": "text",
                        "text": "電話",
                        "size": "sm",
                        "color": "#555555",
                        "flex": 1
                      },
                      {
                        "type": "text",
                        "text": "0912-345-678",
                        "size": "sm",
                        "color": "#111111",
                        "flex": 4
                      }
                    ]
                  }
                ]
              }
            ]
          }
        };

        // 頁面開啟時，只做初始化與登入
        liff.init({ liffId: MY_LIFF_ID })
            .then(() => {
                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }
                // 初始化成功，隱藏轉圈圈，顯示分享按鈕
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status').innerText = '準備就緒！';
                document.getElementById('share-btn').style.display = 'block';
            })
            .catch((err) => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('status').innerText = '系統初始化失敗，請重新開啟';
                console.error(err);
            });

        // 當用戶真正按下按鈕時，才執行分享功能（最安全、最不易被擋）
        function sendMyCard() {
            if (liff.isApiAvailable('shareTargetPicker')) {
                document.getElementById('status').innerText = '正在開啟好友選單...';
                
                liff.shareTargetPicker([
                    {
                        type: "flex",
                        altText: "您收到了一張數位名片",
                        contents: FLEX_MESSAGE_CONTENT
                    }
                ])
                .then((res) => {
                    if (res) {
                        document.getElementById('status').innerText = '分享成功！';
                        setTimeout(() => { liff.closeWindow(); }, 1200);
                    } else {
                        document.getElementById('status').innerText = '已取消分享';
                    }
                })
                .catch((error) => {
                    document.getElementById('status').innerText = '分享失敗，請重試';
                    console.error(error);
                });
            } else {
                alert('您的 LINE 版本不支援分享功能');
            }
        }
    </script>
</body>
</html>
